<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ParkFee 車位分類工具（B1）</title><style>
 *{box-sizing:border-box}
 body{margin:0;font-family:system-ui,"Microsoft JhengHei",sans-serif;display:flex;height:100vh;overflow:hidden}
 #stage{flex:1;overflow:auto;background:#0f172a;position:relative;user-select:none;touch-action:none}
 #wrap{position:relative;width:max-content;transform-origin:0 0}
 #plan{display:block;-webkit-user-drag:none}
 svg{position:absolute;inset:0;width:100%;height:100%}
 .seat circle{r:7;stroke-width:.7}
 .seat text{font-size:6px;fill:#0f172a;text-anchor:middle;pointer-events:none;user-select:none}
 .seat.sel circle{stroke:#000;stroke-width:2.5}
 .cat-motor circle{fill:rgba(59,130,246,.55);stroke:#1d4ed8}      /* 機車-一般(大) 藍 */
 .cat-small circle{fill:rgba(139,92,246,.55);stroke:#6d28d9}      /* 機車-小車位 紫 */
 .cat-access circle{fill:rgba(234,179,8,.6);stroke:#a16207}       /* 機車-無障礙 黃 */
 .cat-heavy circle{fill:rgba(244,63,94,.55);stroke:#be123c}       /* 重機 玫紅 */
 .cat-car   circle{fill:rgba(16,185,129,.6);stroke:#047857}       /* 汽車 綠 */
 .cat-bike  circle{fill:rgba(249,115,22,.65);stroke:#c2410c}      /* 腳踏車 橘 */
 .cat-excl  circle{fill:rgba(148,163,184,.35);stroke:#64748b}     /* 排除 灰 */
 .note-badge{fill:#f59e0b;stroke:#92400e;stroke-width:.6;pointer-events:none}
 #band{position:fixed;border:1.5px dashed #38bdf8;background:rgba(56,189,248,.12);pointer-events:none;display:none;z-index:9}
 #panel{width:260px;flex:none;border-left:1px solid #e2e8f0;padding:14px;overflow:auto;background:#fff}
 h1{font-size:15px;margin:0 0 4px}.sub{font-size:12px;color:#64748b;line-height:1.5;margin:0 0 10px}
 .row{display:flex;gap:6px;margin:6px 0;flex-wrap:wrap}
 button{font-size:13px;padding:6px 9px;border:1px solid #cbd5e1;border-radius:6px;background:#f8fafc;cursor:pointer}
 button:hover{background:#eef2f7}
 button.on{background:#0ea5e9;border-color:#0284c7;color:#fff}
 .b-motor{border-color:#1d4ed8;color:#1d4ed8}.b-car{border-color:#047857;color:#047857}
 .b-bike{border-color:#c2410c;color:#c2410c}.b-excl{border-color:#64748b;color:#475569}
 .b-small{border-color:#6d28d9;color:#6d28d9}.b-access{border-color:#a16207;color:#a16207}
 .b-heavy{border-color:#be123c;color:#be123c}
 #noteInput{flex:1;min-width:0;font-size:13px;padding:6px;border:1px solid #cbd5e1;border-radius:6px}
 #noteList{font-size:12px;line-height:1.6;max-height:160px;overflow:auto}
 #noteList div{cursor:pointer;padding:1px 2px;border-radius:4px}
 #noteList div:hover{background:#f1f5f9}
 #noteList b{color:#92400e}
 .stat{font-size:13px;margin:3px 0;display:flex;justify-content:space-between}
 .dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:middle}
 kbd{background:#f1f5f9;border:1px solid #cbd5e1;border-radius:4px;padding:0 4px;font-size:11px}
 hr{border:none;border-top:1px solid #e2e8f0;margin:12px 0}
 #coord{font-size:11px;color:#94a3b8;font-variant-numeric:tabular-nums}

 <div id="stage"><div id="wrap"><img id="plan" src="b1.png" draggable="false">
   <svg id="svg" viewBox="0 0 2384 1684"></svg></div><div id="band"></div></div>
 <div id="panel">
   <h1>車位分類工具（B1）</h1>
   <p class="sub">框選一區，再按車種把選取點分類。<br>
     <kbd>左鍵拖曳</kbd>框選　<kbd>Shift</kbd>加選<br>
     <kbd>空白鍵+拖曳</kbd>、<kbd>右鍵拖曳</kbd>或<kbd>V</kbd>切換平移<br>
     <kbd>Ctrl+滾輪</kbd>縮放　<kbd>1</kbd>~<kbd>4</kbd>快切機車類別</p>
   <div class="row"><button id="panToggle">✋ 拖曳平移 (V)</button></div>
   <div class="row">
     <button class="b-motor" data-cat="motor">一般大 (1)</button>
     <button class="b-small" data-cat="small">小車位 (2)</button>
     <button class="b-access" data-cat="access">無障礙 (3)</button>
     <button class="b-heavy" data-cat="heavy">重機 (4)</button>
   </div>
   <div class="row">
     <button class="b-car" data-cat="car">汽車 (C)</button>
     <button class="b-bike" data-cat="bike">腳踏車 (B)</button>
     <button class="b-excl" data-cat="excl">排除 (X)</button>
   </div>
   <div class="row"><button id="clearSel">清除選取 (Esc)</button></div>
   <hr>
   <div class="row" style="flex-wrap:nowrap"><input id="noteInput" placeholder="備註（例：漏水）"></div>
   <div class="row"><button id="noteSave">存備註</button><button id="noteDel">刪備註</button></div>
   <div id="noteList"></div>
   <hr>
   <div class="stat"><span><span class="dot" style="background:#3b82f6"></span>一般(大)</span><b id="n-motor">0</b></div>
   <div class="stat"><span><span class="dot" style="background:#8b5cf6"></span>小車位</span><b id="n-small">0</b></div>
   <div class="stat"><span><span class="dot" style="background:#eab308"></span>無障礙</span><b id="n-access">0</b></div>
   <div class="stat"><span><span class="dot" style="background:#f43f5e"></span>重機</span><b id="n-heavy">0</b></div>
   <div class="stat"><span>機車合計 / 目標</span><b><span id="n-msum">0</span> / 655</b></div>
   <div class="stat" style="margin-top:6px"><span><span class="dot" style="background:#10b981"></span>汽車</span><b id="n-car">0</b></div>
   <div class="stat"><span><span class="dot" style="background:#f97316"></span>腳踏車</span><b id="n-bike">0</b></div>
   <div class="stat"><span><span class="dot" style="background:#94a3b8"></span>排除</span><b id="n-excl">0</b></div>
   <div class="stat" style="margin-top:6px"><span>已選取</span><b id="n-sel">0</b></div>
   <hr>
   <div class="row">
     <button id="export">⬇ 匯出 JSON</button>
     <button id="reseed">重套預設分類</button>
     <button id="reset">全部設機車</button>
   </div>
   <p class="sub" style="margin-top:10px">進度自動存於瀏覽器，重新整理不會遺失。匯出檔給開發接手。</p>

 const DISPW = 2384, DISPH = 1684;
 const LS = 'parkfee_b1_class_v3';
 // 預設分類＝SEATS 內嵌的 cat（由 scripts/sync-classify-from-demo.mjs 從 seat-select-demo 現場校正結果同步）
 function seedDefault(){const o={};for(const s of SEATS){if(s.cat&&s.cat!=='motor')o[s.key]=s.cat}return o}
 const svg = document.getElementById('svg');
 const stage = document.getElementById('stage');
 const wrap = document.getElementById('wrap');
 const band = document.getElementById('band');
 const NS = 'http://www.w3.org/2000/svg';
 // 首次開啟（無存檔）→ 用內嵌 cat 當起點
 let cls = localStorage.getItem(LS) ? JSON.parse(localStorage.getItem(LS)) : seedDefault();
 localStorage.setItem(LS, JSON.stringify(cls));
 const sel = new Set();
 const nodes = new Map();

 const CATS=['motor','small','access','heavy','car','bike','excl'];
 const CATNAME={motor:'一般(大)',small:'小車位',access:'無障礙',heavy:'重機',car:'汽車',bike:'腳踏車',excl:'排除'};
 function catClass(c){return CATS.includes(c)?'cat-'+c:'cat-motor'}
 const byKey=new Map(SEATS.map(s=>[s.key,s]));
 // 備註：seat key → 文字，獨立存於瀏覽器，匯出 JSON 時併入 seats
 const LSN='parkfee_b1_notes_v2';
 let notes=JSON.parse(localStorage.getItem(LSN)||'{}');
 for(const s of SEATS){
   const g=document.createElementNS(NS,'g'); g.setAttribute('class','seat '+catClass(cls[s.key]||'motor'));
   const c=document.createElementNS(NS,'circle'); c.setAttribute('cx',s.x); c.setAttribute('cy',s.y);
   const t=document.createElementNS(NS,'text'); t.setAttribute('x',s.x); t.setAttribute('y',s.y+2.5); t.textContent=s.id;
   g.appendChild(c); g.appendChild(t); svg.appendChild(g); nodes.set(s.key,g);
 }
 function syncBadge(key){
   const g=nodes.get(key); if(!g)return;
   let b=g.querySelector('.note-badge'), ti=g.querySelector('title');
   if(notes[key]){
     if(!b){const s=byKey.get(key); b=document.createElementNS(NS,'circle'); b.setAttribute('class','note-badge');
       b.setAttribute('cx',s.x+5.5); b.setAttribute('cy',s.y-5.5); b.setAttribute('r',2.5); g.appendChild(b);}
     if(!ti){ti=document.createElementNS(NS,'title'); g.insertBefore(ti,g.firstChild);}
     ti.textContent=notes[key];
   }else{ if(b)b.remove(); if(ti)ti.remove(); }
 }

 function recount(){
   const n={motor:0,small:0,access:0,heavy:0,car:0,bike:0,excl:0};
   for(const s of SEATS) n[cls[s.key]||'motor']++;
   for(const c of CATS) document.getElementById('n-'+c).textContent=n[c];
   document.getElementById('n-msum').textContent=n.motor+n.small+n.access+n.heavy;
   n_sel.textContent=sel.size;
   // 單選時把該格備註帶進輸入框；無選取則清空
   if(sel.size===1) noteInput.value=notes[[...sel][0]]||'';
   else if(sel.size===0) noteInput.value='';
 }
 const n_sel=document.getElementById('n-sel'),noteInput=document.getElementById('noteInput');

 function setSel(key,on){const g=nodes.get(key); if(!g)return; if(on){sel.add(key);g.classList.add('sel')}else{sel.delete(key);g.classList.remove('sel')}}
 function clearSel(){for(const k of [...sel])setSel(k,false); recount()}
 function applyCat(cat){ if(!sel.size)return; for(const k of sel){cls[k]=cat; const g=nodes.get(k); g.setAttribute('class','seat sel '+catClass(cat));}
   localStorage.setItem(LS,JSON.stringify(cls)); recount(); }

 // 縮放
 let scale=1;
 function applyScale(){wrap.style.transform='scale('+scale+')'}
 stage.addEventListener('wheel',e=>{ if(!e.ctrlKey)return; e.preventDefault();
   const old=scale; scale=Math.min(4,Math.max(.25, scale*(e.deltaY<0?1.1:0.9)));
   const r=stage.getBoundingClientRect(); const ox=(stage.scrollLeft+e.clientX-r.left)/old, oy=(stage.scrollTop+e.clientY-r.top)/old;
   applyScale(); stage.scrollLeft=ox*scale-(e.clientX-r.left); stage.scrollTop=oy*scale-(e.clientY-r.top);
 },{passive:false});

 // 平移（空白鍵或右鍵）/ 框選（左鍵）
 let space=false; addEventListener('keydown',e=>{if(e.code==='Space'){space=true;stage.style.cursor='grab'}});
 addEventListener('keyup',e=>{if(e.code==='Space'){space=false;stage.style.cursor=''}});
 // 拖曳平移模式（觸控／平板用：開啟後左鍵或手指拖曳＝平移）
 let panMode=false;
 const panBtn=document.getElementById('panToggle');
 function setPanMode(on){panMode=on;panBtn.classList.toggle('on',on);stage.style.cursor=on?'grab':''}
 panBtn.onclick=()=>setPanMode(!panMode);
 // 直接用底圖實際螢幕矩形換算圖面座標 → 自動吃掉縮放/捲動/2倍比例
 const plan=document.getElementById('plan');
 function toPlan(cx,cy){const b=plan.getBoundingClientRect();return{x:(cx-b.left)/b.width*DISPW,y:(cy-b.top)/b.height*DISPH}}
 let mode=null,sx,sy,sl,st,startCX,startCY;
 stage.addEventListener('pointerdown',e=>{
   const pan = panMode || space || e.button===2;
   if(pan){mode='pan';sx=e.clientX;sy=e.clientY;sl=stage.scrollLeft;st=stage.scrollTop;stage.setPointerCapture(e.pointerId);e.preventDefault();return}
   if(e.button!==0)return;
   mode='band'; startCX=e.clientX; startCY=e.clientY;
   if(!e.shiftKey)clearSel();
   band.style.display='block'; band.style.left=e.clientX+'px'; band.style.top=e.clientY+'px'; band.style.width='0'; band.style.height='0';
   stage.setPointerCapture(e.pointerId);
 });
 stage.addEventListener('pointermove',e=>{
   const p=toPlan(e.clientX,e.clientY);
   document.getElementById('coord').textContent='x:'+p.x.toFixed(0)+'  y:'+p.y.toFixed(0);
   if(mode==='pan'){stage.scrollLeft=sl-(e.clientX-sx);stage.scrollTop=st-(e.clientY-sy);return}
   if(mode!=='band')return;
   band.style.left=Math.min(startCX,e.clientX)+'px'; band.style.top=Math.min(startCY,e.clientY)+'px';
   band.style.width=Math.abs(e.clientX-startCX)+'px'; band.style.height=Math.abs(e.clientY-startCY)+'px';
   const a=toPlan(startCX,startCY);
   const x0=Math.min(a.x,p.x),x1=Math.max(a.x,p.x),y0=Math.min(a.y,p.y),y1=Math.max(a.y,p.y);
   for(const s of SEATS){if(s.x>=x0&&s.x<=x1&&s.y>=y0&&s.y<=y1)setSel(s.key,true);}
   recount();
 });
 stage.addEventListener('pointerup',e=>{ if(mode==='band'){band.style.display='none'} mode=null; recount(); });
 stage.addEventListener('contextmenu',e=>e.preventDefault());

 document.querySelectorAll('[data-cat]').forEach(b=>b.addEventListener('click',()=>applyCat(b.dataset.cat)));
 document.getElementById('clearSel').onclick=clearSel;
 addEventListener('keydown',e=>{
   if(e.target.tagName==='INPUT'){if(e.key==='Enter')saveNote(); return}
   const m={m:'motor',c:'car',b:'bike',x:'excl','1':'motor','2':'small','3':'access','4':'heavy'};
   if(m[e.key]){applyCat(m[e.key])}
   if(e.key==='v')setPanMode(!panMode);
   if(e.key==='Escape')clearSel();
 });

 // 備註：存／刪／清單（點清單項目可跳到該格）
 function saveNote(){
   if(!sel.size){alert('先選取車位再存備註');return}
   const txt=noteInput.value.trim();
   for(const k of sel){ if(txt)notes[k]=txt; else delete notes[k]; syncBadge(k); }
   localStorage.setItem(LSN,JSON.stringify(notes)); renderNotes();
 }
 document.getElementById('noteSave').onclick=saveNote;
 document.getElementById('noteDel').onclick=()=>{
   if(!sel.size)return;
   for(const k of sel){ delete notes[k]; syncBadge(k); }
   noteInput.value=''; localStorage.setItem(LSN,JSON.stringify(notes)); renderNotes();
 };
 function gotoSeat(key){
   const s=byKey.get(key); if(!s)return;
   clearSel(); setSel(key,true); recount();
   const b=plan.getBoundingClientRect(), r=stage.getBoundingClientRect();
   stage.scrollLeft+=b.left+s.x/DISPW*b.width-r.left-r.width/2;
   stage.scrollTop+=b.top+s.y/DISPH*b.height-r.top-r.height/2;
 }
 function renderNotes(){
   const el=document.getElementById('noteList');
   const ks=Object.keys(notes).map(Number).sort((a,b)=>+(byKey.get(a)||{}).id-+(byKey.get(b)||{}).id);
   el.innerHTML=ks.map(k=>{const s=byKey.get(k);return '<div data-k="'+k+'"><b>'+s.id+'</b>｜'+CATNAME[cls[k]||'motor']+'｜'+notes[k]+'</div>'}).join('')||'<span style="color:#94a3b8">尚無備註</span>';
   el.querySelectorAll('[data-k]').forEach(d=>d.onclick=()=>gotoSeat(+d.dataset.k));
 }
 renderNotes(); for(const k in notes) syncBadge(+k);

 document.getElementById('export').onclick=()=>{
   const n={}; for(const c of CATS) n[c]=+document.getElementById('n-'+c).textContent;
   const out={meta:{dispW:DISPW,dispH:DISPH,total:SEATS.length,generated:'b1-demo-sync'},
     counts:n,
     seats:SEATS.map(s=>({key:s.key,id:s.id,x:s.x,y:s.y,cat:cls[s.key]||'motor',...(s.verified?{verified:true}:{}),...(notes[s.key]?{note:notes[s.key]}:{})}))};
   const blob=new Blob([JSON.stringify(out,null,2)],{type:'application/json'});
   const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='b1-classification.json'; a.click();
 };
 function repaint(){for(const [k,g] of nodes)g.setAttribute('class','seat '+catClass(cls[k]||'motor')); sel.clear(); localStorage.setItem(LS,JSON.stringify(cls)); recount();}
 document.getElementById('reseed').onclick=()=>{ if(!confirm('重設為 demo 同步進來的分類？會覆蓋你的手動調整。'))return; cls=seedDefault(); repaint(); };
 document.getElementById('reset').onclick=()=>{ if(!confirm('全部設為機車（清空分類）？'))return; cls={}; repaint(); };
 recount();
