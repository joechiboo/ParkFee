<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ParkFee 選位 demo（B1）</title><style>
 body{margin:0;font-family:system-ui,"Microsoft JhengHei",sans-serif;display:flex;height:100vh}
 #stage{flex:1;overflow:auto;background:#0f172a;cursor:grab;user-select:none;touch-action:none}
 #stage.grabbing{cursor:grabbing}#wrap{position:relative;width:max-content}
 #plan{display:block;-webkit-user-drag:none}svg{position:absolute;inset:0;width:100%;height:100%}
 .seat text{font-size:6px;text-anchor:middle;pointer-events:none;user-select:none;fill:#0f172a}
 /* 機車：可點選。未盤點＝琥珀（暫定，PDF 抽出未現場核對）；已盤點＝藍 */
 .cat-motor{cursor:pointer}
 .cat-motor circle{fill:rgba(245,158,11,.30);stroke:#d97706;stroke-width:.7}
 .cat-motor:hover circle{fill:rgba(245,158,11,.55)}
 .cat-motor.verified circle{fill:rgba(59,130,246,.45);stroke:#1d4ed8}
 .cat-motor.verified:hover circle{fill:rgba(59,130,246,.75)}
 .cat-motor.sel circle{fill:#ef4444;stroke:#b91c1c}.cat-motor.sel text{fill:#fff;font-weight:700}
 /* 機車子類型：小車位/無障礙/重機 — 可點選、沿用機車琥珀/藍底色，用框型/大小區分 */
 :is(.cat-small,.cat-access,.cat-heavy){cursor:pointer}
 :is(.cat-small,.cat-access,.cat-heavy) circle{fill:rgba(245,158,11,.30);stroke:#d97706;stroke-width:.7}
 :is(.cat-small,.cat-access,.cat-heavy):hover circle{fill:rgba(245,158,11,.55)}
 :is(.cat-small,.cat-access,.cat-heavy).verified circle{fill:rgba(59,130,246,.45);stroke:#1d4ed8}
 :is(.cat-small,.cat-access,.cat-heavy).verified:hover circle{fill:rgba(59,130,246,.75)}
 :is(.cat-small,.cat-access,.cat-heavy).sel circle{fill:#ef4444;stroke:#b91c1c}
 :is(.cat-small,.cat-access,.cat-heavy).sel text{fill:#fff;font-weight:700}
 .cat-small circle{r:6;fill:rgba(139,92,246,.6);stroke:#6d28d9;stroke-width:1.3}
 .cat-small.verified circle{fill:rgba(139,92,246,.85);stroke:#4c1d95;stroke-width:1.6}
 .cat-small text{font-size:5.5px}
 .cat-heavy circle{r:8.5;stroke-width:1.6}
 .cat-access circle{stroke-width:1.8;stroke-dasharray:.8 .8}
 /* 汽車 / 腳踏車：僅參考、不可點 */
 .cat-car circle{fill:rgba(16,185,129,.5);stroke:#047857;stroke-width:.7}.cat-car{pointer-events:none}
 .cat-bike circle{fill:rgba(249,115,22,.55);stroke:#c2410c;stroke-width:.7}.cat-bike{pointer-events:none}
 .cat-excl circle{fill:rgba(148,163,184,.4);stroke:#64748b;stroke-width:.7}.cat-excl{pointer-events:none}
 .hide{display:none}
 #panel{width:240px;border-left:1px solid #e2e8f0;padding:14px;overflow:auto}
 h1{font-size:15px;margin:0 0 8px}.hint{font-size:12px;color:#64748b;line-height:1.5}
 li{font-size:13px}label{font-size:13px;display:flex;align-items:center;gap:6px;margin:7px 0;cursor:pointer}
 .dot{display:inline-block;width:11px;height:11px;border-radius:50%;flex:none}
 .m{background:#3b82f6}.s{background:#8b5cf6}.a{background:#3b82f6;box-shadow:0 0 0 1px #fff,0 0 0 2px #1d4ed8}.c{background:#10b981}.b{background:#f97316}.x{background:#94a3b8}
 .grp{font-size:11px;font-weight:600;color:#475569;margin:10px 0 1px}
 a{font-size:13px;color:#2563eb;text-decoration:none}
</style></head><body>

 <div id="panel"><a href="../">← 回首頁</a><h1 style="margin-top:6px">選位 demo（B1）</h1>
  <p class="hint">真實 B1 平面圖。<b>機車位可點選</b>；汽車/腳踏車為參考。<br><b>按住拖曳平移</b>，Ctrl+滾輪縮放。</p>
  <p class="hint">盤點進度：<b style="color:#1d4ed8">已盤點 585</b> ／ <b style="color:#d97706">未盤點 76</b>（共 661 機車位；琥珀＝待現場核對）</p>
  <div class="grp">機車車位（可點選）</div>
  <label><input type="checkbox" data-filter="motor" checked><span class="dot m"></span>一般（大車位）616</label>
  <label><input type="checkbox" data-filter="small" checked><span class="dot s"></span>小車位 37</label>
  <label><input type="checkbox" data-filter="access" checked><span class="dot a"></span>無障礙 8</label>
  <div class="grp">其他（僅參考）</div>
  <label><input type="checkbox" data-filter="car"><span class="dot c"></span>汽車 55</label>
  <label><input type="checkbox" data-filter="bike"><span class="dot b"></span>腳踏車 164</label>
  <label><input type="checkbox" data-filter="excl"><span class="dot x"></span>排除（雜訊）56</label>
  <hr>
  <div>已選車位 <b id="count">0</b></div><ul id="picked"></ul></div>
<script>
 // 拖曳平移（拖動超過門檻不觸發選位）
 const stage=document.getElementById('stage')
 let down=false,moved=false,sx,sy,sl,st
 stage.addEventListener('pointerdown',e=>{down=true;moved=false;sx=e.clientX;sy=e.clientY;sl=stage.scrollLeft;st=stage.scrollTop;stage.classList.add('grabbing')})
 window.addEventListener('pointermove',e=>{if(!down)return;const dx=e.clientX-sx,dy=e.clientY-sy;if(Math.abs(dx)>4||Math.abs(dy)>4)moved=true;stage.scrollLeft=sl-dx;stage.scrollTop=st-dy})
 window.addEventListener('pointerup',()=>{down=false;stage.classList.remove('grabbing')})
 // 機車家族皆可點選（一般 / 小車位 / 無障礙）
 const picked=new Map()
 const LABEL={motor:'一般機車位',small:'小車位',access:'無障礙機車位'}
 const render=()=>{count.textContent=picked.size;document.getElementById('picked').innerHTML=[...picked].map(([x,t])=>'<li>'+(LABEL[t]||'機車位')+' '+x+'</li>').join('')}
 document.querySelectorAll('.cat-motor,.cat-small,.cat-access').forEach(g=>g.addEventListener('click',()=>{if(moved)return;const id=g.dataset.id;const on=g.classList.toggle('sel');on?picked.set(id,g.dataset.cat):picked.delete(id);render()}))
 // 車種顯示開關（依 data-cat 過濾座位）
 const initHidden={car:true,bike:true,excl:true}
 document.querySelectorAll('input[data-filter]').forEach(cb=>{const c=cb.dataset.filter;const apply=()=>document.querySelectorAll('[data-cat="'+c+'"]').forEach(g=>g.classList.toggle('hide',!cb.checked));if(initHidden[c]){cb.checked=false}apply();cb.addEventListener('change',apply)})
</script></body></html>
