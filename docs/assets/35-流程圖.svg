  <text x="139" y="247.5" text-anchor="start">12/15</text>
  <text x="139" y="259" text-anchor="start">公告</text>
  <text x="69" y="274" text-anchor="start">是</text>

  <text x="64" y="302.5" font-size="13">簽約・繳費</text>
  <text x="64" y="316">公告後 10 日內</text>
  <text x="64" y="349" font-size="11">期限內完成？</text>
  <text x="131" y="339.5">否</text>
  <text x="171.5" y="342.5">視同放棄</text>
  <text x="171.5" y="355">禁止使用</text>
  <text x="69" y="372.5" text-anchor="start">是</text>

  <text x="64" y="407.5" font-size="13">使用車位</text>
