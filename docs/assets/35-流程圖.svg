<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 798.5" font-family="Microsoft JhengHei, PingFang TC, sans-serif" font-size="13.5" font-weight="bold">
  <!-- 抽籤辦法說明表（A4 橫式 Word 版）左欄流程圖。以 11-3v1 的流程圖為底，座標單位同原圖，圖寬 330＝Word 205pt。
       2026-11-04 主委選回 v1 後的調整：所有字與「線上登記」同大小、粗體；第二輪直線往下；三行說明改紅字；虛線對齊表格橫線。
       2026-11-10 經理要求：志願選小車位「否」之後加「登記 選擇志願車位」方塊。
       虛線 y＝表格列分界距圖頂的距離，列高由 scripts/build-explainer-variants.py 固定，改列高要重量。 -->
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#333"/>
    </marker>
  </defs>
  <rect width="330" height="798.5" fill="#fbfcfe"/>
  <g stroke="#999" stroke-dasharray="3 3">
    <line x1="0" y1="287.5" x2="330" y2="287.5"/>
    <line x1="0" y1="480.7" x2="330" y2="480.7"/>
    <line x1="0" y1="630.4" x2="330" y2="630.4"/>
  </g>

  <g stroke="#333" stroke-width="1.5" fill="none" marker-end="url(#ah)">
    <line x1="101" y1="30" x2="101" y2="40"/>
    <line x1="101" y1="92" x2="101" y2="102"/>
    <line x1="198" y1="150" x2="224" y2="150"/>
    <line x1="101" y1="198" x2="101" y2="226"/>
    <line x1="101" y1="268" x2="101" y2="293"/>
    <line x1="101" y1="333" x2="101" y2="340"/>
    <line x1="173" y1="360" x2="274" y2="360"/>
    <line x1="101" y1="380" x2="101" y2="398"/>
    <line x1="101" y1="438" x2="101" y2="488"/>
    <line x1="101" y1="528" x2="101" y2="536"/>
    <line x1="179" y1="558" x2="224" y2="558"/>
    <line x1="101" y1="580" x2="101" y2="640"/>
    <line x1="101" y1="680" x2="101" y2="715"/>
  </g>
  <path d="M275 201V472H101" stroke="#333" stroke-width="1.5" fill="none"/>
  <circle cx="101" cy="472" r="2.6" fill="#333"/>

  <g fill="#c1121f">
    <text x="207" y="145" fill="#1a7f37">是</text>
    <text x="107" y="217">否</text>
    <text x="183" y="355" fill="#1a7f37">是</text>
    <text x="107" y="394">否</text>
    <text x="194" y="553">否</text>
    <text x="107" y="606" fill="#1a7f37">是</text>
  </g>
  <rect x="228" y="212" width="94" height="70" fill="#fbfcfe"/>
  <g text-anchor="middle">
    <text x="275" y="227">免抽籤</text>
    <text x="275" y="243">12/1 公告後</text>
    <text x="275" y="259">10 日內</text>
    <text x="275" y="275">簽約繳費</text>
  </g>
  <text x="107" y="460">配到者</text>

  <rect x="61" y="6" width="80" height="24" rx="12" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="101" y="23" text-anchor="middle">開始</text>

  <rect x="6" y="40" width="190" height="52" rx="3" fill="#1d5fa8"/>
  <g text-anchor="middle" fill="#fff">
    <text x="101" y="55">線上登記</text>
    <text x="101" y="71">115/11/15 – 11/30・掃 QR</text>
    <text x="101" y="87">需協助者由秘書／經理協助</text>
  </g>

  <path d="M101 102L198 150L101 198L4 150Z" fill="#fff" stroke="#1d5fa8" stroke-width="1.6"/>
  <text x="101" y="146" text-anchor="middle">志願選小車位？</text>
  <text x="101" y="164" text-anchor="middle" fill="#c1121f">限每戶第一部機車</text>

  <rect x="224" y="99" width="102" height="102" rx="3" fill="#fff" stroke="#1d5fa8" stroke-width="1.6"/>
  <g text-anchor="middle">
    <text x="275" y="115">登記時直接</text>
    <text x="275" y="131">選定小車位</text>
    <g fill="#c1121f">
      <text x="275" y="147">依登記順序，</text>
      <text x="275" y="163">免抽籤</text>
      <text x="275" y="179">號碼已被選者</text>
      <text x="275" y="195">請改選</text>
    </g>
  </g>

  <!-- 2026-11-10 經理要求：「否」之後加一格，說明不選小車位的人是登記志願車位 -->
  <rect x="41" y="226" width="120" height="42" rx="3" fill="#fff" stroke="#1d5fa8" stroke-width="1.6"/>
  <g text-anchor="middle">
    <text x="101" y="243">登記</text>
    <text x="101" y="260">選擇志願車位</text>
  </g>

  <rect x="6" y="293" width="190" height="40" rx="3" fill="#1d5fa8"/>
  <g text-anchor="middle" fill="#fff">
    <text x="101" y="309">電腦抽籤</text>
    <text x="101" y="326">第一輪 12/1 公告</text>
  </g>

  <path d="M101 340L173 360L101 380L29 360Z" fill="#fff" stroke="#1d5fa8" stroke-width="1.6"/>
  <text x="101" y="365" text-anchor="middle">配到車位？</text>

  <rect x="6" y="398" width="190" height="40" rx="3" fill="#1d5fa8"/>
  <g text-anchor="middle" fill="#fff">
    <text x="101" y="414">電腦抽籤</text>
    <text x="101" y="431">第二輪 12/15 公告</text>
  </g>

  <rect x="6" y="488" width="190" height="40" rx="3" fill="#1d5fa8"/>
  <g text-anchor="middle" fill="#fff">
    <text x="101" y="504">簽約・繳費</text>
    <text x="101" y="521">公告後 10 日內</text>
  </g>

  <path d="M101 536L179 558L101 580L23 558Z" fill="#fff" stroke="#1d5fa8" stroke-width="1.6"/>
  <text x="101" y="563" text-anchor="middle">期限內完成？</text>

  <rect x="224" y="539" width="102" height="38" rx="14" fill="#fff" stroke="#c1121f" stroke-width="1.5"/>
  <g text-anchor="middle" fill="#c1121f">
    <text x="275" y="555">視同放棄</text>
    <text x="275" y="571">禁止使用</text>
  </g>

  <rect x="6" y="640" width="190" height="40" rx="3" fill="#1d5fa8"/>
  <g text-anchor="middle" fill="#fff">
    <text x="101" y="656">使用車位</text>
    <text x="101" y="673">116/1/1 – 12/31</text>
  </g>

  <rect x="61" y="715" width="80" height="24" rx="12" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="101" y="732" text-anchor="middle">結束</text>
</svg>
