  <rect x="144" y="180" width="55" height="47" fill="#fbfcfe"/>

  <text x="64" y="16" font-size="11">開始</text>
  <text x="64" y="43" font-size="13">線上登記</text>
  <text x="64" y="56">115/11/15 – 11/30</text>
  <text x="64" y="68">掃 QR</text>
  <text x="64" y="80">需協助者由秘書協助</text>

  <text x="64" y="120" font-size="10.5">志願選小車位？</text>
