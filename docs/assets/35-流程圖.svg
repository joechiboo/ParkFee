<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 205 479" font-family="Microsoft JhengHei, PingFang TC, sans-serif" font-size="10" font-weight="700" fill="#000" text-anchor="middle">
  <!-- 抽籤辦法說明表（A4 橫式 Word 版）左欄流程圖。座標單位＝pt，圖寬 205pt。
       虛線 y＝表格列分界距圖頂的距離，經理加字使列高改變時要重量（工作流見 scripts/build-explainer-flow.py）。
       2026-11-03 主委要求：所有字粗黑、盡量放大，所以藍底白字改淺底黑字。 -->
