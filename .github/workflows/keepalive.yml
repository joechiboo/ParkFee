# Supabase 免費版閒置 7 天會自動暫停（暫停連 DNS 都撤掉、全站斷線）。
# ⚠️ 教訓（2026-08-10）：純 REST 讀取「不算活動」——每 3 天讀一筆照樣被暫停。
# 改為每日呼叫 Edge Function `ping`（service_role 寫 keepalive 心跳表）＝真實 DB 寫入活動。
# 手動測試：Actions 頁面 → Supabase keep-alive → Run workflow。
# 順帶偵測「稽核斷線」：ping 會寫一筆 system.ping 稽核再讀回來（end-to-end），
# 回傳 auditOk。false ＝ audit_log 寫不進去 —— 而 audit() 刻意不拋錯，
# 平時完全無聲（2026-09-18 漏 grant 那次就是人工才發現的）。
name: Supabase keep-alive

on:
  schedule:
    - cron: '17 1 * * *' # 每天 01:17 UTC（避開整點壅塞）
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: 呼叫 ping Edge Function（DB 寫入心跳，防閒置暫停）
        run: |
          resp=$(curl -sf --max-time 30 -X POST \
            "${{ vars.VITE_SUPABASE_URL }}/functions/v1/ping" \
            -H "apikey: ${{ vars.VITE_SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ vars.VITE_SUPABASE_ANON_KEY }}" \
            -H "Content-Type: application/json" -d '{}') \
            && echo "OK：$resp" \
            || { echo "::error::ping 失敗 — 專案可能已被暫停，請到 supabase.com/dashboard 手動 Resume 後重跑本 workflow"; exit 1; }
